apiVersion: apps/v1
kind: Deployment
metadata:
  name: kairo-demo-tasks-test
  namespace: kairo-kairo-demo-tasks-test
  labels:
    app: kairo-demo-tasks-test
    app.kubernetes.io/managed-by: kairo
spec:
  replicas: 1
  # rollback needs old ReplicaSets to still be around
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: kairo-demo-tasks-test
  template:
    metadata:
      labels:
        app: kairo-demo-tasks-test
        app.kubernetes.io/managed-by: kairo
    spec:
      containers:
        - name: kairo-demo-tasks-test
          image: kairo/kairo-demo-tasks-test:2123081f9e03a815600829e45e541fb3b8fc3bb2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # liveness + memory limit are what make self-healing possible.
          # don't remove them without talking to BE 2
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
